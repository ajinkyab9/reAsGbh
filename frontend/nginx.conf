server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No trailing slash on proxy_pass: the /api prefix is passed through
    # unchanged, matching how Vercel forwards the original path.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
